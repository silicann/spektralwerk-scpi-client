default:
  image: debian:trixie-slim

variables:
  SECURITY_DIR: "$CI_PROJECT_DIR/build/security"

.default_scripts: &install_dependencies
  - apt-get update --yes
  - apt-get install pipx --yes
  # Pin Hatch so CI uses the same environment-management behavior.
  - PIPX_BIN_DIR=/usr/local/bin PIPX_HOME=/opt/pipx pipx install hatch

stages:
  - test
  - style
  - build
  - security

test:unittest:
  stage: test
  before_script:
    - *install_dependencies
  script:
    - hatch test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

style:typing:
  stage: style
  before_script:
    - *install_dependencies
  script:
    - hatch run style:typing
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

style:fmt:
  stage: style
  before_script:
    - *install_dependencies
  script:
    - hatch check fmt
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

style:codespell:
  stage: style
  before_script:
    - *install_dependencies
  script:
    - apt-get install codespell --yes
    - codespell .
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

build:whl:
  stage: build
  before_script:
    - *install_dependencies
  script:
    - hatch build
  artifacts:
    paths:
      - dist/*.whl
      - dist/*.tar.gz

# Build a CycloneDX 1.6 SBOM for the distributable wheel produced by build:whl.
# Install that wheel and its runtime dependencies into a fresh virtual environment
# so the inventory excludes CI and SBOM-generation tools. Validate the resulting
# document, then retain it with SHA-256 hashes of the SBOM and wheel as artifacts.
# This inventory covers Python packages in this CI environment, not device firmware
# or operating-system packages.
security:sbom:
  stage: security
  needs:
    - job: build:whl
      artifacts: true
  before_script:
    - *install_dependencies
    - apt-get install --yes python3-venv
    - PIPX_BIN_DIR=/usr/local/bin PIPX_HOME=/opt/pipx pipx install cyclonedx-bom==7.1.0
    - PIPX_BIN_DIR=/usr/local/bin PIPX_HOME=/opt/pipx pipx install "uv>=0.13.4"
  script:
    - uv venv --python python3 .sbom-venv
    - uv pip install --python .sbom-venv/bin/python dist/*.whl
    - cyclonedx-py environment --pyproject pyproject.toml --mc-type library --spec-version 1.6 --output-format JSON --output-file sbom.cdx.json .sbom-venv/bin/python
    - sha256sum dist/*.whl sbom.cdx.json > sbom.sha256
  artifacts:
    when: always
    expire_in: 1 year
    paths:
      - sbom.cdx.json
      - sbom.sha256

security:pip-audit:
  stage: security
  before_script:
    - *install_dependencies
  script:
    - hatch -e security run pip-audit --format json --output audit.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - audit.json

security:cve-scan:
  stage: security
  needs:
    - job: security:sbom
      artifacts: true
  before_script:
    - *install_dependencies
  script:
    - |
      hatch -e security run cve-bin-tool \
        --disable-data-source GAD \
        --sbom cyclonedx \
        --sbom-file sbom.cdx.json \
        --format json \
        --output-file cve-report.json
  artifacts:
    when: always
    paths:
      - cve-report.json
