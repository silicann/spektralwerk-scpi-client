default:
  image: debian:trixie-slim

variables:
  SECURITY_DIR: "$CI_PROJECT_DIR/build/security"

.default_scripts: &install_dependencies
  - apt-get update --yes
  - apt-get install pipx --yes
  - PIPX_BIN_DIR=/usr/local/bin PIPX_HOME=/opt/pipx pipx install hatch

stages:
  - test
  - security
  - style
  - build

test:unittest:
  stage: test
  before_script:
    - *install_dependencies
  script:
    - hatch test
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always


security:sbom:
  stage: security
  image: python:3.12-slim
  before_script:
    - *install_dependencies
  script:
    # Make sure the committed lock file is up to date
    - hatch -e security dep lock --check
    # Synchronize environment with pylock.toml
    - hatch -e security dep sync
    # pip needs to be updated since it cause vulnerability issue
    - hatch -e security run python -m ensurepip --upgrade
    - hatch -e security run python -m pip install --upgrade "pip>=26.1.2"
    # Install SBOM generator into the Hatch environment
    - hatch run pip install cyclonedx-bom
    # Generate CycloneDX SBOM from actually installed packages
    - hatch run cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
  artifacts:
    paths:
      - sbom.cdx.json

security:pip-audit:
  stage: security
  before_script:
    - *install_dependencies
  script:
    - hatch -e security run pip-audit --format cyclonedx-json --output audit.cdx.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - audit.cdx.json

security:cve-scan:
  stage: security
  needs:
    - job: security:sbom
      artifacts: true
  before_script:
    - *install_dependencies
    # pip needs to be updated since it cause vulnerability issue
    - hatch -e security run python -m ensurepip --upgrade
    - hatch -e security run python -m pip install --upgrade "pip>=26.1.2"
  script:
    - |
      hatch -e security run cve-bin-tool \
        --sbom cyclonedx \
        --sbom-file sbom.cdx.json \
        --format json \
        --output-file cve-report.json
  artifacts:
    when: always
    paths:
      - sbom.cdx.json
      - cve-report.json

style:typing:
  stage: style
  before_script:
    - *install_dependencies
  script:
    - hatch run style:typing
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

style:fmt:
  stage: style
  before_script:
    - *install_dependencies
  script:
    - hatch check fmt
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

style:codespell:
  stage: style
  before_script:
    - *install_dependencies
  script:
    - apt-get install codespell --yes
    - codespell .
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always

build:whl:
  stage: build
  before_script:
    - *install_dependencies
  script:
    - hatch build
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: always
