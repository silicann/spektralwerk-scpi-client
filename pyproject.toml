[build-system]
requires = [
  "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "spektralwerk_scpi_client"
version = "0.7.0"
description = "Spektralwerk SCPI communication library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Spektralwerk", "SCPI"]
classifiers = ["Programming Language :: Python"]
dependencies = [
  "cobs",
  "pyVISA>=1.15.0",
  "pyVISA-py>=0.8.0",
]

[tool.hatch]
lock-envs = true  # create a lock file for all environments if not explicitly denied
locker = "uv"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
packages = ["spektralwerk_scpi_client"]

[tool.hatch.build.targets.wheel]
packages = ["spektralwerk_scpi_client"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.default.scripts]
version = 'bump-my-version bump {args}'
firmware-updater = "python3 tools/firmware_updater/__main__.py {args}"
spektralwerk-recovery = "python3 tools/firmware_updater/recovery.py"

[tools.hatch.envs.examples]

[tool.hatch.envs.examples.scripts]
spw_core_demo = "python3 examples/spektralwerk_core_demo.py"
spw_core_advanced = "python3 examples/spektralwerk_core_advanced_demo.py"

[tool.hatch.envs.security]
locked = false  # tooling is separate from the released runtime inventory
dependencies = [
  "pip-audit",
  "cve-bin-tool",
  "certifi>=2026.10.19",
  "cryptography>=50.0.0",
  "httplib2>=0.32.0",
]

[tool.hatch.envs.style]
locked = false  # no pylock.toml for style environment
extra-dependencies = [
  "mypy>=1.11.0",
  "pytest>=8.3.3",
]

[tool.hatch.envs.style.scripts]
typing = ["mypy --install-types --non-interactive {args:spektralwerk_scpi_client tests}"]

[tool.hatch.envs.hatch-test]
extra-args = ["-vv"]
locked = false  # no pylock.toml for test environment

[tool.hatch.envs.hatch-build]
locked = false

[tool.hatch.envs.hatch-check-fmt]
locked = false

[tool.uv]
# exclude dependencies newer than 3 days to reduce the risk of supply chain attacks
exclude-newer = "3 days"

[tool.ruff.lint.per-file-ignores]
"examples/*" = [
  "INP001", # ignore missing __init__.py in examples/ folder
  "T201",   # ignore print return
]
"tests/*" = [
  "INP001", # ignore missing __init__.py in examples/ folder
  "S101",   # allow usage of asserts for tests in tests/ folder
  "ARG001", # allow unused function arguments
]

[[tool.mypy.overrides]]
module = ["cobs.*"]
follow_untyped_imports = true


[tool.coverage.run]
source_pkgs = ["spektralwerk_scpi_client", "tests"]

branch = true
parallel = true

[tool.coverage.paths]
spektralwerk_scpi_client = [
  "spektralwerk_scpi_client",
]
tests = [
  "tests",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.codespell]
skip = "./.git*/,./.mypy_cache/"
count = true
quiet-level = 3
